<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderação de Fóruns — Futuro Digital CML</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1e3a8a;
            --text-main: #111827;
            --text-muted: #6b7280;
            --text-sub: #9ca3af;
            --border: #e5e7eb;
            --border-subtle: #f3f4f6;
            --bg: #fafafa;
            --card-bg: #ffffff;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg); color: var(--text-main); padding-bottom: 70px; font-size: 13px; -webkit-font-smoothing: antialiased; }

        /* Barra Superior Minimalista */
        header {
            position: sticky; top: 0; z-index: 50;
            background: #ffffff; border-bottom: 1px solid var(--border);
            padding: 10px 24px; display: flex; justify-content: space-between; align-items: center;
        }
        .header-left { display: flex; align-items: baseline; gap: 8px; }
        .header-title { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .header-subtitle { font-size: 12px; color: var(--text-muted); }

        .header-right { display: flex; align-items: center; gap: 14px; }
        .header-stats { font-size: 12px; font-weight: 600; color: var(--text-muted); }

        .user-select-wrap { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-muted); }
        .user-select {
            border: 1px solid var(--border); background: #ffffff; font-size: 12px; font-weight: 600;
            color: var(--text-main); border-radius: 6px; padding: 3px 6px; outline: none; cursor: pointer;
        }

        /* Toolbar Discreta */
        .toolbar {
            max-width: 1560px; margin: 12px auto; padding: 0 16px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .search-bar { width: 240px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px; outline: none; background: #fff; }
        .search-bar:focus { border-color: var(--primary); }
        .select-filter { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; outline: none; background: #fff; color: var(--text-main); cursor: pointer; }

        .btn-group { display: flex; gap: 6px; align-items: center; }
        button { cursor: pointer; border: none; border-radius: 6px; font-size: 12px; transition: all 0.1s; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
        
        /* Botões secundários: neutros e com ícones */
        .btn-icon { background: #fff; border: 1px solid var(--border); color: var(--text-main); padding: 6px 10px; font-size: 13px; }
        .btn-icon:hover { background: #f3f4f6; }
        
        /* Botão principal */
        .btn-main { background: var(--primary); color: #fff; font-weight: 600; padding: 6px 14px; }
        .btn-main:hover { background: var(--primary-hover); }

        /* Tabela / Lista Minimalista */
        .table-container { max-width: 1560px; margin: 0 auto; padding: 0 16px; }
        .table-header {
            display: grid;
            grid-template-columns: 220px 1fr 1.5fr 70px;
            gap: 16px; padding: 8px 12px;
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
            color: var(--text-sub);
        }

        .row-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: 220px 1fr 1.5fr 70px;
            gap: 16px;
            align-items: start;
            transition: border-color 0.1s;
        }
        .row-item:hover { border-color: #cbd5e1; }
        .row-item.status-app { border-left: 3px solid var(--success); }
        .row-item.status-rej { border-left: 3px solid var(--danger); opacity: 0.5; }
        .row-item.status-pub { border-left: 3px solid #94a3b8; opacity: 0.55; background: #f8fafc; }
        .row-item.status-pub .r-area { background: #f1f5f9; color: #64748b; cursor: not-allowed; border-color: #cbd5e1; }
        .row-item.status-pub .btn-action { cursor: not-allowed; opacity: 0.6; pointer-events: none; }
        .row-item.status-pub .chk-item { cursor: not-allowed; opacity: 0.5; pointer-events: none; }
        .badge-published { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #475569; background: #e2e8f0; border-radius: 4px; padding: 2px 6px; margin-top: 4px; width: fit-content; }

        /* Col 1: Formando (Simples e Elegante) */
        .col-u { display: flex; flex-direction: column; gap: 2px; }
        .u-name { font-weight: 600; font-size: 13px; color: var(--text-main); }
        .u-meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-top: 1px; flex-wrap: wrap; }
        .u-link { color: var(--primary); text-decoration: none; }
        .u-link:hover { text-decoration: underline; }
        .u-val { font-size: 11px; color: var(--success); font-weight: 500; margin-top: 3px; }

        /* Col 2: Dúvida */
        .col-p { font-size: 12.5px; line-height: 1.45; color: var(--text-main); white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow-y: auto; padding-right: 4px; }

        /* Col 3: Resposta Editável */
        .col-r { display: flex; flex-direction: column; }
        .r-area {
            width: 100%; min-height: 85px; height: 85px; padding: 6px 8px;
            border: 1px solid var(--border); border-radius: 4px;
            font-size: 12px; line-height: 1.4; color: var(--text-main);
            font-family: inherit; resize: vertical; outline: none; background: #ffffff;
        }
        .r-area:focus { border-color: var(--primary); }

        /* Col 4: Ações */
        .col-a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
        .btn-action {
            width: 28px; height: 28px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; border: 1px solid var(--border);
            background: #fff; cursor: pointer; color: var(--text-muted);
        }
        .btn-action:hover { background: #f3f4f6; }
        .btn-action.btn-v.active { background: var(--success); color: #fff; border-color: var(--success); }
        .btn-action.btn-x.active { background: var(--danger); color: #fff; border-color: var(--danger); }
        .chk-item { width: 14px; height: 14px; cursor: pointer; margin-top: 2px; }

        /* Rodapé Fixo Minimalista */
        .footer-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: #ffffff; border-top: 1px solid var(--border);
            padding: 8px 24px; display: flex; justify-content: space-between; align-items: center;
        }
        .footer-txt { font-size: 12px; color: var(--text-muted); font-weight: 500; }

        /* Toast Discreto */
        #toast {
            position: fixed; bottom: 60px; right: 20px; z-index: 100;
            background: #1f2937; color: #fff; padding: 8px 14px; border-radius: 6px;
            font-size: 12px; display: none; align-items: center; gap: 6px;
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <!-- Barra Superior -->
    <header>
        <div class="header-left">
            <span class="header-title">Moderação de Fóruns</span>
            <span class="header-subtitle">Teams & SharePoint</span>
        </div>
        <div class="header-right">
            <div class="user-select-wrap">
                <span>Formador:</span>
                <select id="userSelector" class="user-select" onchange="onUserChange(this.value)">
                    <option value="Vanessa">Vanessa</option>
                    <option value="Hélder Toucas">Hélder Toucas</option>
                </select>
            </div>
            <div class="header-stats" id="statSummary">0 / 0 validados</div>
        </div>
    </header>

    <!-- Barra de Ferramentas -->
    <div class="toolbar">
        <div class="filter-group">
            <input type="text" id="searchInp" class="search-bar" placeholder="Pesquisar..." oninput="onFilter()">
            <select id="aulaFilter" class="select-filter" onchange="onFilter()">
                <option value="">Todas as Aulas</option>
            </select>
            <select id="statusFilter" class="select-filter" onchange="onFilter()">
                <option value="">Todos os Estados</option>
                <option value="PENDING">Pendentes</option>
                <option value="APPROVED">Validados</option>
                <option value="REJECTED">Rejeitados</option>
                <option value="PUBLISHED">Já Publicados / Respondidos</option>
            </select>
        </div>
        <div class="btn-group">
            <button class="btn-icon" onclick="selectAll(true)" title="Selecionar Todos">☑️</button>
            <button class="btn-icon" onclick="selectAll(false)" title="Desmarcar Todos">◻️</button>
            <button class="btn-icon" onclick="approveSelected()" title="Validar Selecionados">⚡ Validar</button>
            <button class="btn-main" onclick="syncWithGitHub()">Gravar no GitHub</button>
        </div>
    </div>

    <!-- Lista de Posts -->
    <div class="table-container">
        <div class="table-header">
            <div>Formando</div>
            <div>Dúvida</div>
            <div>Resposta</div>
            <div style="text-align: center;">Ações</div>
        </div>
        <div id="rowsContainer"></div>
    </div>

    <!-- Rodapé -->
    <div class="footer-bar">
        <div class="footer-txt" id="footerTxt">0 respostas validadas</div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="btn-icon" onclick="resetAll()" title="Restaurar sugestões originais da IA">↺</button>
            <button class="btn-icon" onclick="exportLocalJson()" title="Descarregar ficheiro JSON">💾</button>
            <button class="btn-main" onclick="syncWithGitHub()">Gravar no GitHub</button>
        </div>
    </div>

    <script>
        let posts = [];

        const CONFIG = {
            validatorName: localStorage.getItem('cml_validator_name') || 'Vanessa',
            githubToken: localStorage.getItem('cml_github_token') || '',
            repo: 'heldertoucas/cml-moodle-widgets',
            path: 'moderacao/data/moderacao.json'
        };

        function formatShortDate(str) {
            if (!str) return '';
            // Extrai formato curto se possível (ex: "23 set, 11:02")
            const m = str.match(/(\d{1,2})\s+de\s+([a-z]+)[^0-9]*(\d{1,2}:\d{2})/i);
            if (m) {
                const mes = m[2].substring(0, 3);
                return `${m[1]} ${mes}, ${m[3]}`;
            }
            return str.replace('quarta-feira, ', '').replace(' de 2026', '');
        }

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const paramToken = urlParams.get('token') || urlParams.get('key');
            const paramUser = urlParams.get('user');

            if (paramToken) {
                CONFIG.githubToken = paramToken;
                localStorage.setItem('cml_github_token', paramToken);
            }
            if (paramUser) {
                CONFIG.validatorName = paramUser;
                localStorage.setItem('cml_validator_name', paramUser);
            }

            if (paramToken || paramUser) {
                window.history.replaceState({}, document.title, window.location.pathname);
                showToast(`Formador ativo: ${CONFIG.validatorName}`);
            }

            const userSel = document.getElementById('userSelector');
            if (userSel) userSel.value = CONFIG.validatorName;

            await loadData();
            populateAulaFilter();
            render();
        }

        function onUserChange(name) {
            CONFIG.validatorName = name;
            localStorage.setItem('cml_validator_name', name);
            showToast(`Formador: ${name}`);
            render();
        }

        async function loadData() {
            try {
                const res = await fetch('data/moderacao.json?t=' + Date.now());
                if (res.ok) {
                    posts = await res.json();
                    return;
                }
            } catch (e) {}

            try {
                const resFallback = await fetch('forum_posts_pendentes.json?t=' + Date.now());
                if (resFallback.ok) {
                    posts = await resFallback.json();
                }
            } catch (err) {}
        }

        function populateAulaFilter() {
            const aulas = [...new Set(posts.map(p => p.aula_num || '1.1'))].sort();
            const sel = document.getElementById('aulaFilter');
            sel.innerHTML = '<option value="">Todas as Aulas</option>';
            aulas.forEach(a => {
                sel.innerHTML += `<option value="${a}">Aula ${a}</option>`;
            });
        }

        function render() {
            const container = document.getElementById('rowsContainer');
            const search = document.getElementById('searchInp').value.toLowerCase();
            const aula = document.getElementById('aulaFilter').value;
            const status = document.getElementById('statusFilter').value;

            let filtered = posts.filter(p => {
                if (aula && p.aula_num !== aula) return false;
                if (status === 'PUBLISHED') {
                    if (p.publication_status !== 'PUBLISHED' && p.publication_status !== 'ALREADY_ANSWERED' && !p.has_tutor_reply) return false;
                } else if (status && p.moderation_status !== status) {
                    return false;
                }
                if (search) {
                    const matchName = (p.student_name || '').toLowerCase().includes(search);
                    const matchText = (p.student_text || '').toLowerCase().includes(search);
                    const matchReply = ((p.final_reply || p.suggested_reply) || '').toLowerCase().includes(search);
                    if (!matchName && !matchText && !matchReply) return false;
                }
                return true;
            });

            let html = '';
            filtered.forEach(p => {
                const isPublished = p.publication_status === 'PUBLISHED' || p.publication_status === 'ALREADY_ANSWERED' || p.has_tutor_reply;
                let statusCls = '';
                if (isPublished) {
                    statusCls = 'status-pub';
                } else if (p.moderation_status === 'APPROVED') {
                    statusCls = 'status-app';
                } else if (p.moderation_status === 'REJECTED') {
                    statusCls = 'status-rej';
                }
                const replyText = p.final_reply !== undefined ? p.final_reply : p.suggested_reply;
                const shortDate = formatShortDate(p.posted_at);

                html += `
                <div class="row-item ${statusCls}">
                    <div class="col-u">
                        <div class="u-name">${escapeHtml(p.student_name)}</div>
                        <div class="u-meta">
                            <span>Aula ${escapeHtml(p.aula_num || '1.1')}</span>
                            <span>•</span>
                            <span>${escapeHtml(shortDate)}</span>
                            ${p.discussion_url ? `<span>•</span> <a href="${p.discussion_url}" target="_blank" class="u-link">Moodle ↗</a>` : ''}
                        </div>
                        ${isPublished ? `<div class="badge-published">✓ Respondido no Moodle</div>` : (p.validator_name ? `<div class="u-val">✓ Validado por ${escapeHtml(p.validator_name)}</div>` : '')}
                    </div>
                    <div class="col-p">${escapeHtml(p.student_text)}</div>
                    <div class="col-r">
                        <textarea class="r-area" ${isPublished ? 'disabled title="Esta mensagem já possui resposta no Moodle."' : ''} oninput="onEditReply('${p.idempotency_key}', this.value)">${escapeHtml(replyText)}</textarea>
                    </div>
                    <div class="col-a">
                        <div style="display: flex; gap: 4px;">
                            <button class="btn-action btn-v ${p.moderation_status === 'APPROVED' ? 'active' : ''}" ${isPublished ? 'disabled' : ''} title="Aprovar" onclick="setPostStatus('${p.idempotency_key}', 'APPROVED')">✓</button>
                            <button class="btn-action btn-x ${p.moderation_status === 'REJECTED' ? 'active' : ''}" ${isPublished ? 'disabled' : ''} title="Rejeitar" onclick="setPostStatus('${p.idempotency_key}', 'REJECTED')">✕</button>
                        </div>
                        <input type="checkbox" class="chk-item" ${isPublished ? 'disabled' : ''} data-key="${p.idempotency_key}">
                    </div>
                </div>`;
            });

            container.innerHTML = html || '<div style="text-align: center; padding: 40px; color: var(--text-muted);">Nenhuma dúvida encontrada.</div>';
            updateStats();
        }

        function onEditReply(key, val) {
            const p = posts.find(i => i.idempotency_key === key);
            if (p) {
                p.final_reply = val;
                p.is_edited = true;
            }
        }

        function setPostStatus(key, status) {
            const p = posts.find(i => i.idempotency_key === key);
            if (p) {
                p.moderation_status = status;
                if (status === 'APPROVED') {
                    p.validator_name = CONFIG.validatorName || 'Vanessa';
                    p.validated_at = new Date().toISOString();
                } else {
                    p.validator_name = '';
                    p.validated_at = '';
                }
                render();
            }
        }

        function selectAll(val) {
            document.querySelectorAll('.chk-item').forEach(c => c.checked = val);
        }

        function approveSelected() {
            const chks = document.querySelectorAll('.chk-item:checked');
            if (!chks.length) {
                alert('Selecione pelo menos uma linha.');
                return;
            }
            chks.forEach(c => {
                const k = c.getAttribute('data-key');
                const p = posts.find(i => i.idempotency_key === k);
                if (p) {
                    p.moderation_status = 'APPROVED';
                    p.validator_name = CONFIG.validatorName || 'Vanessa';
                    p.validated_at = new Date().toISOString();
                }
            });
            render();
            showToast(`${chks.length} validados por ${CONFIG.validatorName}`);
        }

        function resetAll() {
            if (!confirm('Restaurar todas as sugestões originais?')) return;
            posts.forEach(p => {
                p.final_reply = p.suggested_reply;
                p.is_edited = false;
            });
            render();
        }

        function updateStats() {
            const tot = posts.length;
            const app = posts.filter(p => p.moderation_status === 'APPROVED').length;
            document.getElementById('statSummary').innerText = `${app} de ${tot} validados`;
            document.getElementById('footerTxt').innerText = `${app} de ${tot} respostas validadas para publicação`;
        }

        function onFilter() {
            render();
        }

        async function syncWithGitHub() {
            if (!CONFIG.githubToken) {
                alert('Token de acesso não configurado.');
                return;
            }

            const btns = document.querySelectorAll('.btn-main');
            btns.forEach(b => b.innerText = 'A gravar...');

            try {
                const getUrl = `https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.path}`;
                const getRes = await fetch(getUrl, {
                    headers: {
                        'Authorization': `Bearer ${CONFIG.githubToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                let sha = null;
                if (getRes.ok) {
                    const data = await getRes.json();
                    sha = data.sha;
                }

                const contentStr = JSON.stringify(posts, null, 2);
                const base64Content = btoa(unescape(encodeURIComponent(contentStr)));
                const validador = CONFIG.validatorName || 'Vanessa';

                const putRes = await fetch(getUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.githubToken}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: `docs(forum): validacao por ${validador}`,
                        content: base64Content,
                        sha: sha || undefined
                    })
                });

                if (!putRes.ok) throw new Error('Erro ao gravar');

                showToast(`Gravado no GitHub com sucesso (${validador})`);
            } catch (err) {
                alert(`Erro ao sincronizar: ${err.message}`);
            } finally {
                btns.forEach(b => b.innerText = 'Gravar no GitHub');
            }
        }

        function exportLocalJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(posts, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "moderacao.json");
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'flex';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        window.onload = init;
    </script>
</body>
</html>
